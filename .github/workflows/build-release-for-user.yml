name: Build Release APK (User)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: true
        default: 'stable-3.26.15-cover-radius'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clear 18PlusList.txt
        run: |
          echo "" > $GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Restore signing keystore
        shell: bash
        run: |
          echo "${{ secrets.USER_SIGNING_KEY }}" | base64 -d > "$GITHUB_WORKSPACE/app/my-release-key.jks"
          {
            echo ""
            echo "RELEASE_STORE_FILE=my-release-key.jks"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.USER_KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.USER_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.USER_KEY_PASSWORD }}"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppRelease --no-daemon --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: 3.26.15-ios-books

      - name: Check Build Output
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/app/release"
          ls -la "$APK_PATH" || true
          if [ -z "$(find "$APK_PATH" -name "*.apk" -print -quit)" ]; then
            echo "未找到 APK 文件！"
            exit 1
          fi

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-ios-books-arm64-v8a
          if-no-files-found: error
          path: app/build/outputs/apk/app/release/*arm64-v8a*.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-ios-books-universal
          if-no-files-found: warn
          path: app/build/outputs/apk/app/release/*universal*.apk
